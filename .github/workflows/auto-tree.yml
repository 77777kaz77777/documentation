name: Auto Update README Tree

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is called master
  workflow_dispatch:

jobs:
  update-readme-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Generate Formatted Tree & Update README
        run: |
          python3 -c '
          import os, re

          FOLDER_DESCS = {
              "updates": "Distro maintenance & update scripts",
              "configs": "Terminal & CLI tool dotfiles",
              "desktop-tweaks": "UI customization & desktop scripts",
              "security": "Antivirus & system defense utilities",
              "utils": "General standalone helper scripts"
          }

          IGNORE_PATHS = {".git", ".github", "README.md", "tree_output.txt"}

          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for _ in range(5):
                          line = f.readline().strip()
                          if line.startswith("# Description:"):
                              return line.replace("# Description:", "").strip()
                          elif line.startswith("#") and not line.startswith("#!"):
                              return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""

          repo_name = os.path.basename(os.getcwd()) + "/"
          lines = [repo_name]

          entries = [e for e in sorted(os.listdir(".")) if e not in IGNORE_PATHS]
          dirs = [e for e in entries if os.path.isdir(e)]

          for d_idx, d in enumerate(dirs):
              is_last_dir = (d_idx == len(dirs) - 1)
              dir_prefix = "└── " if is_last_dir else "├── "

              folder_desc = FOLDER_DESCS.get(d, "")
              dir_line = f"{dir_prefix}📁 {d}/"
              lines.append((dir_line, f"# {folder_desc}" if folder_desc else ""))

              sub_path = os.path.join(".", d)
              files = sorted([f for f in os.listdir(sub_path) if f not in IGNORE_PATHS])

              for f_idx, f in enumerate(files):
                  is_last_file = (f_idx == len(files) - 1)
                  indent = "    " if is_last_dir else "│   "
                  file_prefix = "└── " if is_last_file else "├── "

                  file_path = os.path.join(sub_path, f)
                  desc = get_file_description(file_path)

                  item_line = f"{indent}{file_prefix}{f}"
                  lines.append((item_line, f"# {desc}" if desc else ""))

          max_len = max(len(item[0]) if isinstance(item, tuple) else len(item) for item in lines)
          padding = max(max_len + 4, 40)

          formatted_tree = []
          for item in lines:
              if isinstance(item, str):
                  formatted_tree.append(item)
              else:
                  left, comment = item
                  if comment:
                      formatted_tree.append(f"{left:<{padding}}{comment}")
                  else:
                      formatted_tree.append(left)

          tree_str = "```text\n" + "\n".join(formatted_tree) + "\n```"

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"(<!-- START_SECTION:tree -->)(.*?)(<!-- END_SECTION:tree -->)"
          replacement = r"\1\n" + tree_str + r"\n\3"
          updated = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(updated)
          '

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "docs: auto-update directory structure in README"
